name: Bug report
description: Something in INKPLAY doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Create (drawing / photo / canvas)
        - Playing a level
        - Gallery
        - Ink Arena
        - Survival
        - Running my own copy
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Upload …
        3. See …
  - type: textarea
    id: drawing
    attributes:
      label: Drawing or screenshot
      description: If a drawing was read wrong, attach the photo (only if you're happy for it to be public).
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 7 / Chrome 140, MacBook / Safari 26
